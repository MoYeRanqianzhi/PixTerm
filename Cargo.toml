[package]
name = "pixterm"
version = "0.1.0"
edition = "2024"
description = "终端像素画板程序 - Terminal Pixel Art Editor"
license = "MIT"

[dependencies]
# 终端交互库：raw mode、alternate screen、鼠标捕获、事件处理
crossterm = "0.28"
# 序列化框架
serde = { version = "1", features = ["derive"] }
# JSON 序列化/反序列化
serde_json = "1"
# gzip 压缩/解压：用于 .ptd 压缩存储格式
flate2 = "1.1"
# 图像处理：PNG 导入/导出
image = { version = "0.25", default-features = false, features = ["png"] }
